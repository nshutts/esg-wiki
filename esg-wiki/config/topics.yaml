# Wiki topic map (human-curated structure; Gemma writes the note content).
#
# Each topic becomes one note: vault/wiki/<folder>/<name>.md. The filename is the
# readable subject name, so re-ingesting always updates the same file and never
# creates a duplicate.
#   id          stable machine ID, stored in the note's properties
#   terms       phrases used to (a) pick evidence passages for the note and
#               (b) tell chat mode that a message is about the notes
#   related     links written into "Related notes", each with the reason it matters.
#               Reasons are written from the sources and checked by hand.

folders:
  - name: Frameworks and Standards
    blurb: Voluntary global baselines that most mandatory regimes build on.
  - name: Europe
    blurb: EU laws and the standards that implement them.
  - name: United States
    blurb: Federal and California climate disclosure rules.
  - name: Other Jurisdictions
    blurb: Mandatory regimes outside the US and EU that appear in the sources.
  - name: Concepts
    blurb: Ideas that cut across frameworks and regulations.

topics:
  # ---------------- Frameworks and Standards ----------------
  - id: issb
    name: ISSB Standards
    folder: Frameworks and Standards
    description: IFRS S1 and S2, the investor-focused global baseline.
    terms: [ISSB, IFRS S1, IFRS S2, International Sustainability Standards Board, IFRS Sustainability Disclosure Standards]
    related:
      - [TCFD, "IFRS S1 and S2 use the four TCFD pillars and absorbed the TCFD recommendations after it disbanded."]
      - [SASB Standards, "SASB is part of the IFRS Foundation, and the ISSB builds on its industry-specific approach."]
      - [Double Materiality, "The ISSB applies a financial materiality lens, while CSRD requires double materiality."]
      - [Australia AASB S2, "Australia's mandatory climate standard is based on IFRS S2."]
      - [California SB 253 and SB 261, "SB 261 climate risk reports may follow TCFD or ISSB."]

  - id: gri
    name: GRI Standards
    folder: Frameworks and Standards
    description: The most widely used impact-focused reporting standards.
    terms: [GRI, Global Reporting Initiative, GRI 102, GRI 103]
    related:
      - [Double Materiality, "GRI is built on impact materiality, the 'impact' half of double materiality."]
      - [CSRD and ESRS, "ESRS is designed to be interoperable with GRI."]
      - [UN Sustainable Development Goals, "The comparison table lists GRI as aligned with the UN SDGs."]
      - [Standards vs Frameworks, "Novata uses GRI as an example of a standard rather than a framework."]

  - id: sasb
    name: SASB Standards
    folder: Frameworks and Standards
    description: Industry-specific, financially material disclosure standards for 77 industries.
    terms: [SASB, Sustainability Accounting Standards Board]
    related:
      - [ISSB Standards, "SASB sits within the IFRS Foundation and underpins the ISSB's industry-specific approach."]
      - [Double Materiality, "SASB focuses on financially material issues, one side of double materiality."]

  - id: tcfd
    name: TCFD
    folder: Frameworks and Standards
    description: Climate-related financial disclosure recommendations, now carried by the ISSB.
    terms: [TCFD, Task Force on Climate, Task Force for Climate]
    related:
      - [ISSB Standards, "The IFRS Foundation incorporated the full TCFD recommendations into IFRS S1 and S2."]
      - [California SB 253 and SB 261, "TCFD is a blueprint for California's SB 261."]
      - [Standards vs Frameworks, "Novata uses TCFD as its main example of a framework."]
      - [CDP, "The comparison table lists TCFD and CDP as aligned."]

  - id: cdp
    name: CDP
    folder: Frameworks and Standards
    description: Global environmental disclosure system, formerly the Carbon Disclosure Project.
    terms: [CDP, Carbon Disclosure Project]
    related:
      - [SBTi, "The comparison table lists CDP and SBTi as aligned."]
      - [TCFD, "The comparison table lists CDP and TCFD as aligned."]

  - id: sbti
    name: SBTi
    folder: Frameworks and Standards
    description: Science-based corporate emissions reduction targets.
    terms: [SBTi, Science-Based Targets, Science Based Targets]
    related:
      - [CDP, "The comparison table lists SBTi as aligned with CDP."]
      - [Scope 1 2 and 3 Emissions, "SBTi targets are emissions reduction targets."]

  - id: ghg-protocol
    name: GHG Protocol
    folder: Frameworks and Standards
    description: The emissions accounting rulebook every regime in the sources relies on.
    terms: [GHG Protocol, Scope 2 Guidance, Scope 3 Standard, Corporate Standard]
    related:
      - [Scope 1 2 and 3 Emissions, "The GHG Protocol defines how Scope 1, 2 and 3 emissions are measured."]
      - [California SB 253 and SB 261, "SB 253 requires emissions to be measured under the GHG Protocol."]
